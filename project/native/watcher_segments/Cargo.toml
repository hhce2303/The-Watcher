# watcher_segments — native segment-compilation engine (R-6, ADR-0006).
#
# Compiled to a Python extension module (.pyd) via PyO3 + maturin.
# The lossless TS→MP4 remux/concat/trim engine is implemented in src/lib.rs;
# media-crate versions are pinned (`=`) for reproducible native builds.
[package]
name = "watcher_segments"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Lossless MPEG-TS → MP4 remux / concat / keyframe-trim engine for The Watcher"

[lib]
name = "watcher_segments"
# cdylib → a loadable Python extension; rlib → so the logic is unit-testable.
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }

# Pure-Rust media crates (no external DLLs → clean PyInstaller bundle).
mpeg2ts-reader = "=0.18.2"   # MPEG-TS demux + PES/keyframe detection (MIT/Apache)
shiguredo_mp4  = "=2026.3.0" # Pure-Rust Sans-I/O MP4 mux (Encode/Decode)

[profile.release]
opt-level = 3
lto = true
