name: CI

# Tests of the daemon subset, including the import-purity gate (spec section 6).
# Windows is the target platform: tests that drive Windows-only code paths
# (subprocess.CREATE_NO_WINDOW, Job Objects) only execute there.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: pytest (includes tests/test_import_purity.py)
        run: python -m pytest -q
