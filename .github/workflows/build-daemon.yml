name: Build daemon (Windows)

# Builds the headless daemon bundle (PyInstaller one-dir) for hand-testing on a
# Windows machine (watcher-win). Uses the same spec as installer/build.ps1.
# The native Rust segment engine is skipped: the app falls back to FFmpeg.
# The import-purity gate runs first: a bundle with editor/player/Qt/Tauri code
# must never be produced.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-daemon.yml
      - installer/**
      - app/**
      - requirements*.txt

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt
      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt
      - name: Install FFmpeg
        run: choco install ffmpeg -y
      - name: Import-purity gate
        run: python -m pytest tests/test_import_purity.py -q
      - name: PyInstaller
        run: pyinstaller --noconfirm --distpath dist --workpath build "installer/The Watcher.spec"
      - name: Stage .env
        shell: pwsh
        run: |
          Copy-Item .env.example "dist/The Watcher/.env"
          Copy-Item installer/Update-Watcher.ps1 "dist/The Watcher/"
      - uses: actions/upload-artifact@v4
        with:
          name: the-watcher-daemon-windows
          path: dist/The Watcher
          retention-days: 14
