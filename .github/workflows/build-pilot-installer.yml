name: Build pilot installer (Windows)

# This workflow produces a field installer from an explicit test-pilot profile.
# It never receives a CA private key from the repository: mkcert creates an
# ephemeral CA on the GitHub-hosted runner. The installer contains only the
# station leaf key required by the file-mode pilot. The matching public root is
# uploaded separately for the IT supervisor-trust step.
on:
  workflow_dispatch:
    inputs:
      station_name:
        description: "Pilot station label (letters, numbers, dot, underscore, dash)"
        required: true
        type: string
      station_id:
        description: "Positive Daily station ID"
        required: true
        type: string
      endpoint_name:
        description: "DNS name or resolvable hostname used by LAN supervisors"
        required: true
        type: string
      ip_addresses:
        description: "Optional comma-separated IPv4/IPv6 SANs"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build signed-by-pilot-CA installer
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      STATION_NAME: ${{ inputs.station_name }}
      STATION_ID: ${{ inputs.station_id }}
      ENDPOINT_NAME: ${{ inputs.endpoint_name }}
      IP_ADDRESSES: ${{ inputs.ip_addresses }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install test, packaging, and pilot provisioning tools
        shell: pwsh
        run: |
          choco install ffmpeg innosetup mkcert -y --no-progress
          pip install -r requirements-dev.txt
          if (-not (Get-Command mkcert.exe -ErrorAction SilentlyContinue)) { throw "mkcert.exe was not installed." }
          if (-not (Get-Command iscc.exe -ErrorAction SilentlyContinue)) { throw "Inno Setup was not installed." }

      - name: Verify source before packaging
        run: python -m pytest -q

      - name: Generate ephemeral pilot profile
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          if ($env:STATION_NAME -notmatch '^[A-Za-z0-9][A-Za-z0-9._-]*$') { throw 'station_name has an invalid format.' }
          $stationId = 0
          if (-not [int]::TryParse($env:STATION_ID, [ref]$stationId) -or $stationId -lt 1) { throw 'station_id must be a positive integer.' }
          if ($env:ENDPOINT_NAME -notmatch '^[A-Za-z0-9][A-Za-z0-9.-]*$') { throw 'endpoint_name has an invalid format.' }

          $provisioningRoot = Join-Path $env:RUNNER_TEMP 'watcher-provisioning'
          $releaseRoot = Join-Path $env:GITHUB_WORKSPACE 'release'
          $stationRoot = Join-Path $provisioningRoot (Join-Path 'operators' $env:STATION_NAME)
          $certRoot = Join-Path $stationRoot 'certs'
          $trustRoot = Join-Path $certRoot 'trust'
          New-Item -ItemType Directory -Force -Path $certRoot, $trustRoot, $releaseRoot | Out-Null

          $env:CAROOT = Join-Path $provisioningRoot 'test-ca'
          mkcert -install
          if ($LASTEXITCODE -ne 0) { throw "mkcert -install failed with exit code $LASTEXITCODE." }

          $ipAddresses = @($env:IP_ADDRESSES -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ })
          foreach ($address in $ipAddresses) {
            $parsed = $null
            if (-not [System.Net.IPAddress]::TryParse($address, [ref]$parsed)) { throw "Invalid IP address: $address" }
          }

          $leafCertificate = Join-Path $certRoot 'live-view.pem'
          $leafKey = Join-Path $certRoot 'live-view-key.pem'
          $sans = @($env:ENDPOINT_NAME, 'localhost', '127.0.0.1') + $ipAddresses | Select-Object -Unique
          mkcert -cert-file $leafCertificate -key-file $leafKey @sans
          if ($LASTEXITCODE -ne 0) { throw "mkcert leaf issuance failed with exit code $LASTEXITCODE." }

          $issuerResponse = Invoke-RestMethod -Uri 'https://gbtmbuzlnxdjcexppomf.supabase.co/functions/v1/watcher-assertion-public-key' -Method Get -TimeoutSec 20
          if (-not $issuerResponse.public_jwk -or -not $issuerResponse.kid) { throw 'Daily returned an invalid assertion public-key document.' }
          $issuerPath = Join-Path $certRoot 'daily-issuer-public.pem'
          [System.IO.File]::WriteAllText($issuerPath, ($issuerResponse.public_jwk | ConvertTo-Json -Compress), [System.Text.UTF8Encoding]::new($false))

          $rootCertificate = Join-Path $env:CAROOT 'rootCA.pem'
          if (-not (Test-Path -LiteralPath $rootCertificate -PathType Leaf)) { throw 'mkcert did not generate rootCA.pem.' }
          Copy-Item $rootCertificate (Join-Path $trustRoot 'watcher-pilot-rootCA.pem') -Force
          Copy-Item $rootCertificate (Join-Path $releaseRoot 'watcher-pilot-rootCA.pem') -Force

          $profile = @(
            'LIVE_VIEW_ENABLED=true'
            'LIVE_VIEW_BIND_HOST=0.0.0.0'
            'LIVE_VIEW_PORT=8767'
            "LIVE_VIEW_ORIGIN=https://$($env:ENDPOINT_NAME):8767"
            'LIVE_VIEW_PARENT_ORIGIN=https://daily.sig.systems'
            'LIVE_VIEW_ISSUER=daily.sig.systems'
            'LIVE_VIEW_AUDIENCE=the-watcher-live'
            "LIVE_VIEW_ISSUER_KID=$($issuerResponse.kid)"
            "LIVE_VIEW_STATION_ID=$stationId"
            'LIVE_VIEW_CERT_FILE=certs\\live-view.pem'
            'LIVE_VIEW_KEY_FILE=certs\\live-view-key.pem'
            'LIVE_VIEW_ISSUER_PUBLIC_KEY_FILE=certs\\daily-issuer-public.pem'
            'LIVE_VIEW_HEARTBEAT_URL=https://gbtmbuzlnxdjcexppomf.supabase.co/functions/v1/watcher-heartbeat'
            'LIVE_VIEW_HEARTBEAT_SECONDS=30'
            'LIVE_VIEW_MAX_VIEWERS=3'
            'BROWSER_LOCAL_ENABLED=true'
            'BROWSER_LOCAL_PARENT_ORIGIN=https://daily.sig.systems'
            'BROWSER_LOCAL_ISSUER=daily.sig.systems'
            'BROWSER_LOCAL_AUDIENCE=the-watcher-local'
            "BROWSER_LOCAL_ISSUER_KID=$($issuerResponse.kid)"
            "BROWSER_LOCAL_STATION_ID=$stationId"
            'BROWSER_LOCAL_CERT_FILE=certs\\live-view.pem'
            'BROWSER_LOCAL_KEY_FILE=certs\\live-view-key.pem'
            'BROWSER_LOCAL_ISSUER_PUBLIC_KEY_FILE=certs\\daily-issuer-public.pem'
          )
          $profilePath = Join-Path $stationRoot 'operator-deployment.env'
          [System.IO.File]::WriteAllLines($profilePath, $profile, [System.Text.UTF8Encoding]::new($false))
          "OPERATOR_DEPLOYMENT_CONFIG=$profilePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_ROOT=$releaseRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build field installer
        shell: pwsh
        run: |
          .\installer\build.ps1 -OutDir $env:RELEASE_ROOT -OperatorDeploymentConfig $env:OPERATOR_DEPLOYMENT_CONFIG -RequireInstaller
          $installer = Get-ChildItem -LiteralPath $env:RELEASE_ROOT -Filter 'Setup-The Watcher.exe' -File -Recurse | Select-Object -First 1
          if (-not $installer) { throw 'Setup-The Watcher.exe was not produced.' }
          Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName | Format-List

      - name: Verify installer and trust artifacts
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath $env:RELEASE_ROOT -Filter 'Setup-The Watcher.exe' -File -Recurse | Select-Object -First 1
          if (-not $installer -or $installer.Length -lt 1MB) { throw 'Installer is missing or unexpectedly small.' }
          $root = Join-Path $env:RELEASE_ROOT 'watcher-pilot-rootCA.pem'
          if (-not (Test-Path -LiteralPath $root -PathType Leaf)) { throw 'Supervisor trust certificate is missing.' }
          Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName, $root | Format-Table -AutoSize

      - name: Upload pilot installer
        uses: actions/upload-artifact@v4
        with:
          name: the-watcher-pilot-installer-${{ inputs.station_name }}
          path: |
            release/Setup-The Watcher.exe
            release/The Watcher-*.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload supervisor trust certificate
        uses: actions/upload-artifact@v4
        with:
          name: the-watcher-pilot-supervisor-trust-${{ inputs.station_name }}
          path: release/watcher-pilot-rootCA.pem
          if-no-files-found: error
          retention-days: 7
